<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HyperFrames Master Template</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="hyperframes-composition" data-duration="15s" data-fps="60" data-width="1920" data-height="1080">
  <div class="track" data-track="main">
    <div class="clip hero" data-start="0s" data-duration="5s">
      <h1 class="kinetic-title">Opus 5.5 Motion</h1>
      <p class="subtitle">100% Code-Driven Animation</p>
    </div>
    <div class="clip cockpit" data-start="5s" data-duration="6s">
      <div class="ui-card">
        <div class="card-header">Finanzcockpit</div>
        <div class="card-metric">€148,500</div>
      </div>
    </div>
    <div class="clip payoff" data-start="11s" data-duration="4s">
      <div class="wordmark-resolve">Opus Video Director</div>
    </div>
  </div>
</body>
</html>
